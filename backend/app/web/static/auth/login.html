<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to VERITAS — verified identity and secure account access." />
    <title>Sign in · VERITAS</title>
    <link rel="stylesheet" href="/assets/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="brand-pane">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14L12 19 5 5Z" /></svg>
          </span>
          VERITAS
        </div>
        <div class="brand-copy">
          <h1>Security begins with trusted access.</h1>
          <p>Accounts are verified and approved before they can enter the workspace.</p>
        </div>
        <div class="brand-note">
          <span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" /></svg>
            Authorized access
          </span>
          <span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" /></svg>
            Audited actions
          </span>
          <span>
            <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            Private by design
          </span>
        </div>
      </section>

      <section class="form-pane">
        <form class="auth-panel" id="loginForm">
          <div class="eyebrow">Welcome back</div>
          <h2>Sign in</h2>
          <p class="lede">Use your approved VERITAS account credentials.</p>
          <div class="notice" role="status"></div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password" />
          </div>
          <button type="submit">Sign in</button>
          <div class="links">
            <a href="/signup">Create account</a>
            <a href="/forgot">Forgot password?</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/assets/auth.js"></script>
  </body>
</html>

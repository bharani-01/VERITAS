<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify email · VERITAS</title>
    <link rel="stylesheet" href="/assets/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="brand-pane">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14L12 19 5 5Z" /></svg>
          </span>
          VERITAS
        </div>
        <div class="brand-copy">
          <h1>One step closer.</h1>
          <p>Verification places your account in the administrator approval queue.</p>
        </div>
        <div class="brand-note">
          <span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><path d="m22 4-10 10-3-3" /></svg>
            Email confirmed
          </span>
          <span>
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
            Awaiting approval
          </span>
        </div>
      </section>

      <section class="form-pane">
        <div class="auth-panel">
          <div class="eyebrow">Email verification</div>
          <h2>Verifying your email</h2>
          <p class="lede">If this link is valid, your account moves to the approval queue.</p>
          <div class="notice" role="status"></div>
          <div class="links">
            <a href="/">Return to sign in</a>
          </div>
        </div>
      </section>
    </main>
    <script src="/assets/auth.js"></script>
  </body>
</html>

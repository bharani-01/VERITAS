<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose password · VERITAS</title>
    <link rel="stylesheet" href="/assets/auth.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="brand-pane">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14L12 19 5 5Z" /></svg>
          </span>
          VERITAS
        </div>
        <div class="brand-copy">
          <h1>Set a new password.</h1>
          <p>Existing sessions are revoked immediately after a successful change.</p>
        </div>
        <div class="brand-note">
          <span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" /></svg>
            Sessions revoked
          </span>
          <span>
            <svg class="icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><path d="m22 6-10 7L2 6" /></svg>
            Confirmation emailed
          </span>
        </div>
      </section>

      <section class="form-pane">
        <form class="auth-panel" id="resetConfirmForm">
          <div class="eyebrow">Password reset</div>
          <h2>Choose a new password</h2>
          <p class="lede">Use at least 12 characters. You will sign in again afterward.</p>
          <div class="notice" role="status"></div>
          <div class="field">
            <label for="password">New password</label>
            <input id="password" name="password" type="password" required minlength="12" autocomplete="new-password" />
          </div>
          <button type="submit">Update password</button>
          <div class="links">
            <a href="/">Return to sign in</a>
          </div>
        </form>
      </section>
    </main>
    <script src="/assets/auth.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="VERITAS — verified identity and secure account access." />
    <title>VERITAS</title>
    <script>
      try {
        var path = location.pathname || "";
        var key = path.indexOf("/admin") === 0 ? "veritas.admin.navCollapsed" : "veritas.user.navCollapsed";
        if (localStorage.getItem(key) === "1") document.documentElement.classList.add("nav-pref-collapsed");
        var theme = localStorage.getItem("veritas.theme");
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
        void theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
